<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0A07">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>손맛 필름 — 호야당</title>
  <meta name="description" content="20년의 이야기들. 사진으로 전하는 호야당의 손맛.">

  <link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0D0A07;
      --dark: #1A1714;
      --warm-dark: #2A2420;
      --gold: #D4A853;
      --gold-dim: rgba(212, 168, 83, 0.6);
      --cream: #FFFAF5;
      --cream-dim: rgba(255, 250, 245, 0.7);
      --red: #FF4500;
      --film-shadow: #2A2420;

      --f-serif: 'Cormorant Garamond', 'Noto Serif KR', serif;
      --f-sans: 'Noto Sans KR', -apple-system, sans-serif;
      --f-mono: 'JetBrains Mono', monospace;
      --f-ko-serif: 'Noto Serif KR', serif;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      font-family: var(--f-sans);
      background: var(--black);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--gold);
      color: var(--black);
    }

    a { color: inherit; text-decoration: none; }

    /* ═══ GRAIN OVERLAY ═══ */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ═══ HEADER ═══ */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, var(--black) 0%, transparent 100%);
    }

    .header-back {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--f-mono);
      font-size: 0.75rem;
      color: var(--cream-dim);
      letter-spacing: 0.1em;
      transition: color 0.3s;
    }

    .header-back:hover { color: var(--gold); }

    .header-back svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s var(--ease-out);
    }

    .header-back:hover svg { transform: translateX(-4px); }

    .header-logo {
      font-family: var(--f-ko-serif);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--gold);
    }

    /* ═══ HERO ═══ */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 30%, rgba(212, 168, 83, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 30% 70%, rgba(212, 168, 83, 0.05) 0%, transparent 40%);
      pointer-events: none;
    }

    /* Kodak Header */
    .kodak-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.2s forwards;
    }

    .kodak-logo {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .kodak-k {
      font-family: var(--f-mono);
      font-size: 2rem;
      font-weight: 700;
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .kodak-stripes {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .kodak-stripes span {
      height: 4px;
      background: var(--red);
      border-radius: 1px;
    }

    .kodak-stripes span:nth-child(1) { width: 24px; }
    .kodak-stripes span:nth-child(2) { width: 20px; }
    .kodak-stripes span:nth-child(3) { width: 16px; }

    .hero-eyebrow {
      font-family: var(--f-mono);
      font-size: 0.7rem;
      color: var(--gold);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.4s forwards;
    }

    .hero-title {
      font-family: var(--f-ko-serif);
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.6s forwards;
    }

    .hero-subtitle {
      font-family: var(--f-serif);
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-style: italic;
      color: var(--cream-dim);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.8s forwards;
    }

    .hero-desc {
      font-size: 0.9375rem;
      color: var(--cream-dim);
      line-height: 2;
      max-width: 400px;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 1s forwards;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 1.2s forwards;
    }

    .scroll-text {
      font-family: var(--f-mono);
      font-size: 0.625rem;
      color: var(--gold-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 60px;
      position: relative;
      overflow: hidden;
    }

    .scroll-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0% { transform: translateY(-100%); }
      50% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ═══ CATEGORY TABS ═══ */
    .category-section {
      padding: 0 2rem;
      margin-bottom: 4rem;
    }

    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      border-bottom: 1px solid var(--warm-dark);
    }

    .category-tab {
      padding: 1.5rem 2.5rem;
      font-family: var(--f-mono);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--cream-dim);
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      transition: color 0.3s;
    }

    .category-tab::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transition: transform 0.4s var(--ease-out);
    }

    .category-tab:hover { color: var(--cream); }

    .category-tab.active {
      color: var(--gold);
    }

    .category-tab.active::after {
      transform: scaleX(1);
    }

    .category-count {
      display: inline-block;
      margin-left: 0.5rem;
      padding: 0.2rem 0.5rem;
      background: var(--warm-dark);
      border-radius: 10px;
      font-size: 0.625rem;
      color: var(--cream-dim);
    }

    /* ═══ FILM GALLERY ═══ */
    .gallery {
      padding: 0 2rem 6rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ═══ FILM CARD ═══ */
    .film-card {
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .film-card-inner {
      position: relative;
      background: var(--dark);
      border: 1px solid var(--warm-dark);
      overflow: hidden;
      transition: transform 0.5s var(--ease-out), box-shadow 0.5s var(--ease-out);
    }

    .film-card:hover .film-card-inner {
      transform: translateY(-8px) rotateX(2deg);
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        0 0 0 1px var(--gold-dim);
    }

    /* Sprocket holes */
    .film-card-sprockets {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 1rem 0;
      background: var(--black);
      z-index: 2;
    }

    .film-card-sprockets--left { left: 0; }
    .film-card-sprockets--right { right: 0; }

    .sprocket {
      width: 12px;
      height: 8px;
      background: var(--warm-dark);
      border-radius: 2px;
      margin: 0 auto;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Film frame number */
    .film-card-frame {
      position: absolute;
      top: 0.75rem;
      right: 1.75rem;
      font-family: var(--f-mono);
      font-size: 0.6rem;
      color: var(--red);
      text-shadow: 0 0 8px rgba(255, 69, 0, 0.8);
      z-index: 3;
    }

    /* Image container */
    .film-card-image {
      position: relative;
      margin: 0 20px;
      aspect-ratio: 3/4;
      overflow: hidden;
    }

    .film-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.9) contrast(1.05);
      transition: transform 0.8s var(--ease-out), filter 0.5s;
    }

    .film-card:hover .film-card-image img {
      transform: scale(1.08);
      filter: saturate(1.1) contrast(1.1);
    }

    /* Film grain overlay */
    .film-card-grain {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.1;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Light leak effect */
    .film-card-leak {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 200, 100, 0.1) 0%,
        transparent 30%,
        transparent 70%,
        rgba(255, 100, 50, 0.08) 100%
      );
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }

    .film-card:hover .film-card-leak { opacity: 1; }

    /* Content */
    .film-card-content {
      padding: 1.25rem 1.75rem 1.5rem;
      margin: 0 20px;
      border-top: 1px solid var(--warm-dark);
      background: linear-gradient(180deg, var(--dark) 0%, var(--black) 100%);
    }

    .film-card-category {
      font-family: var(--f-mono);
      font-size: 0.6rem;
      color: var(--gold);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .film-card-title {
      font-family: var(--f-ko-serif);
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
      transition: color 0.3s;
    }

    .film-card:hover .film-card-title { color: var(--gold); }

    .film-card-subtitle {
      font-size: 0.8125rem;
      color: var(--cream-dim);
    }

    .film-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--warm-dark);
    }

    .film-card-date {
      font-family: var(--f-mono);
      font-size: 0.7rem;
      color: var(--cream-dim);
      letter-spacing: 0.05em;
    }

    .film-card-frames {
      font-family: var(--f-mono);
      font-size: 0.65rem;
      color: var(--gold-dim);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .film-card-frames::before {
      content: '';
      width: 16px;
      height: 12px;
      background:
        linear-gradient(90deg, var(--gold-dim) 2px, transparent 2px),
        linear-gradient(var(--gold-dim) 2px, transparent 2px);
      background-size: 6px 4px;
      opacity: 0.6;
    }

    /* Kodak edge */
    .film-card-edge {
      height: 8px;
      margin: 0 20px;
      background: linear-gradient(90deg,
        #FFD700 0%, #FFD700 33%,
        var(--red) 33%, var(--red) 66%,
        #FFD700 66%, #FFD700 100%
      );
    }

    /* ═══ EMPTY STATE ═══ */
    .gallery-empty {
      text-align: center;
      padding: 6rem 2rem;
      color: var(--cream-dim);
    }

    .gallery-empty-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.3;
    }

    /* ═══ FOOTER ═══ */
    .footer {
      padding: 4rem 2rem;
      text-align: center;
      border-top: 1px solid var(--warm-dark);
    }

    .footer-logo {
      font-family: var(--f-ko-serif);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .footer-text {
      font-family: var(--f-mono);
      font-size: 0.7rem;
      color: var(--cream-dim);
      letter-spacing: 0.1em;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 768px) {
      .header { padding: 1rem 1.5rem; }
      .hero { padding: 5rem 1.5rem; }
      .category-tab { padding: 1rem 1.5rem; font-size: 0.7rem; }
      .gallery { padding: 0 1.5rem 4rem; }
      .gallery-grid { gap: 2rem; }
    }

    @media (max-width: 480px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
      .kodak-header { flex-direction: column; gap: 0.5rem; }
    }

    /* ═══ PAGE TRANSITIONS ═══ */
    .page-enter {
      opacity: 0;
    }

    .page-enter-active {
      opacity: 1;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>

  <div class="grain"></div>

  <!-- Header -->
  <header class="header">
    <a href="/" class="header-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      HOME
    </a>
    <span class="header-logo">호야당</span>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="kodak-header">
      <div class="kodak-logo">
        <span class="kodak-k">K</span>
        <div class="kodak-stripes">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <p class="hero-eyebrow">Photo Essay Collection</p>
    <h1 class="hero-title">손맛 필름</h1>
    <p class="hero-subtitle">20 Years in Frames</p>
    <p class="hero-desc">
      요리하는 사진작가, 사진 찍는 요리사.<br>
      20년의 손맛을 프레임에 담았습니다.
    </p>

    <div class="scroll-indicator">
      <span class="scroll-text">Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- Category Tabs -->
  <section class="category-section">
    <div class="category-tabs">
      <button class="category-tab active" data-category="all">
        ALL <span class="category-count" id="countAll">0</span>
      </button>
      <button class="category-tab" data-category="bread">
        BREAD <span class="category-count" id="countBread">0</span>
      </button>
      <button class="category-tab" data-category="chef">
        CHEF <span class="category-count" id="countChef">0</span>
      </button>
    </div>
  </section>

  <!-- Gallery -->
  <section class="gallery">
    <div class="gallery-grid" id="galleryGrid">
      <!-- Cards will be inserted by JS -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p class="footer-logo">호야당</p>
    <p class="footer-text">Con las manos. 손으로.</p>
  </footer>

  <script>
  (function() {
    'use strict';

    // Story data
    const stories = [
      {
        id: 'sobulgogi',
        category: 'bread',
        title: '소불고기의 탄생',
        subtitle: '20년 시그니처가 되기까지',
        cover: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800&q=80',
        date: '2006',
        frames: 5
      },
      {
        id: 'dawn',
        category: 'chef',
        title: '새벽 4시의 남자',
        subtitle: '20년, 매일 같은 시간',
        cover: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=800&q=80',
        date: '2006-2026',
        frames: 5
      },
      {
        id: 'cream',
        category: 'bread',
        title: '크림치즈의 비밀',
        subtitle: '부드러움의 과학',
        cover: 'https://images.unsplash.com/photo-1486427944544-d2c6128c6029?w=800&q=80',
        date: '2010',
        frames: 4
      },
      {
        id: 'hands',
        category: 'chef',
        title: '손의 기억',
        subtitle: '기계가 모르는 감촉',
        cover: 'https://images.unsplash.com/photo-1517686469429-8bdb88b9f907?w=800&q=80',
        date: '2015',
        frames: 6
      }
    ];

    const galleryGrid = document.getElementById('galleryGrid');
    const categoryTabs = document.querySelectorAll('.category-tab');
    let currentCategory = 'all';
    let frameCounter = 1;

    // Update counts
    function updateCounts() {
      document.getElementById('countAll').textContent = stories.length;
      document.getElementById('countBread').textContent = stories.filter(s => s.category === 'bread').length;
      document.getElementById('countChef').textContent = stories.filter(s => s.category === 'chef').length;
    }

    // Create film card
    function createFilmCard(story, index) {
      const frameNum = String(frameCounter++).padStart(3, '0');
      const categoryLabel = story.category === 'bread' ? 'BREAD STORY' : 'CHEF STORY';

      const card = document.createElement('a');
      card.href = `viewer.html?id=${story.id}`;
      card.className = 'film-card';
      card.dataset.category = story.category;
      card.style.opacity = '0';
      card.style.transform = 'translateY(40px)';

      card.innerHTML = `
        <div class="film-card-inner">
          <div class="film-card-edge"></div>

          <div class="film-card-sprockets film-card-sprockets--left">
            <span class="sprocket"></span>
            <span class="sprocket"></span>
            <span class="sprocket"></span>
            <span class="sprocket"></span>
            <span class="sprocket"></span>
          </div>

          <div class="film-card-sprockets film-card-sprockets--right">
            <span class="sprocket"></span>
            <span class="sprocket"></span>
            <span class="sprocket"></span>
            <span class="sprocket"></span>
            <span class="sprocket"></span>
          </div>

          <span class="film-card-frame">▶ ${frameNum}</span>

          <div class="film-card-image">
            <img src="${story.cover}" alt="${story.title}" loading="lazy">
            <div class="film-card-grain"></div>
            <div class="film-card-leak"></div>
          </div>

          <div class="film-card-content">
            <p class="film-card-category">${categoryLabel}</p>
            <h3 class="film-card-title">${story.title}</h3>
            <p class="film-card-subtitle">${story.subtitle}</p>
            <div class="film-card-meta">
              <span class="film-card-date">${story.date}</span>
              <span class="film-card-frames">${story.frames} frames</span>
            </div>
          </div>

          <div class="film-card-edge"></div>
        </div>
      `;

      // Staggered animation
      setTimeout(() => {
        card.style.transition = 'opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, index * 150);

      return card;
    }

    // Render gallery
    function renderGallery(category = 'all') {
      galleryGrid.innerHTML = '';
      frameCounter = 1;

      const filtered = category === 'all'
        ? stories
        : stories.filter(s => s.category === category);

      filtered.forEach((story, index) => {
        galleryGrid.appendChild(createFilmCard(story, index));
      });
    }

    // Tab switching
    categoryTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        categoryTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.dataset.category;
        renderGallery(currentCategory);
      });
    });

    // Initialize
    updateCounts();
    renderGallery();

  })();
  </script>

</body>
</html>
