<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0D0A07">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>손맛 필름 — 호야당</title>

  <link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0D0A07;
      --dark: #1A1714;
      --warm-dark: #2A2420;
      --gold: #D4A853;
      --gold-dim: rgba(212, 168, 83, 0.6);
      --cream: #FFFAF5;
      --cream-dim: rgba(255, 250, 245, 0.7);
      --red: #FF4500;

      --f-serif: 'Cormorant Garamond', 'Noto Serif KR', serif;
      --f-sans: 'Noto Sans KR', -apple-system, sans-serif;
      --f-mono: 'JetBrains Mono', monospace;
      --f-ko-serif: 'Noto Serif KR', serif;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
    }

    body {
      font-family: var(--f-sans);
      background: var(--black);
      color: var(--cream);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ═══ GRAIN ═══ */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ═══ HEADER ═══ */
    .viewer-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(13, 10, 7, 0.95) 0%, transparent 100%);
      transform: translateY(0);
      transition: transform 0.4s var(--ease-out), opacity 0.4s;
    }

    .viewer-header.hidden {
      transform: translateY(-100%);
      opacity: 0;
    }

    .header-back {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem;
      margin: -0.75rem;
      color: var(--cream);
      transition: color 0.3s;
    }

    .header-back:hover { color: var(--gold); }

    .header-back svg {
      width: 24px;
      height: 24px;
    }

    .header-title {
      font-family: var(--f-ko-serif);
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      flex: 1;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.5s, transform 0.5s var(--ease-out);
    }

    .header-title.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .header-counter {
      font-family: var(--f-mono);
      font-size: 0.75rem;
      color: var(--gold);
      min-width: 60px;
      text-align: right;
    }

    /* ═══ FILM FRAME CONTAINER ═══ */
    .film-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Sprocket decoration - sides */
    .film-sprocket-side {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 24px;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 60px 0;
      z-index: 50;
    }

    .film-sprocket-side--left { left: 0; }
    .film-sprocket-side--right { right: 0; }

    .film-sprocket-side .sprocket {
      width: 14px;
      height: 10px;
      background: var(--black);
      border-radius: 2px;
      margin: 0 auto;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    @media (max-width: 768px) {
      .film-sprocket-side { display: none; }
    }

    /* ═══ SLIDES TRACK ═══ */
    .slides-track {
      display: flex;
      height: 100%;
      will-change: transform;
      transition: transform 0.6s var(--ease-out);
    }

    .slides-track.dragging {
      transition: none;
    }

    /* ═══ SLIDE ═══ */
    .slide {
      flex: 0 0 100%;
      width: 100vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 24px;
    }

    @media (min-width: 769px) {
      .slide { padding: 24px 48px; }
    }

    /* ═══ SLIDE IMAGE ═══ */
    .slide-image-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .slide-image-frame {
      position: relative;
      width: 100%;
      max-width: 500px;
      max-height: 65vh;
      aspect-ratio: 3/4;
    }

    .slide-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 3px solid var(--warm-dark);
      filter: saturate(0.95) contrast(1.05);
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out);
    }

    .slide.active .slide-image {
      opacity: 1;
      transform: scale(1);
    }

    /* Film grain on image */
    .slide-image-grain {
      position: absolute;
      inset: 3px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.08;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Frame number */
    .slide-frame-num {
      position: absolute;
      top: -8px;
      right: 12px;
      font-family: var(--f-mono);
      font-size: 0.6rem;
      color: var(--red);
      text-shadow: 0 0 8px rgba(255, 69, 0, 0.8);
      opacity: 0;
      transition: opacity 0.5s 0.3s;
    }

    .slide.active .slide-frame-num { opacity: 1; }

    /* Kodak edge markings */
    .slide-kodak-edge {
      position: absolute;
      bottom: -6px;
      left: 12px;
      font-family: var(--f-mono);
      font-size: 0.5rem;
      color: var(--gold-dim);
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.5s 0.4s;
    }

    .slide.active .slide-kodak-edge { opacity: 1; }

    /* Light leak */
    .slide-light-leak {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 200, 100, 0.12) 0%,
        transparent 25%,
        transparent 75%,
        rgba(255, 100, 50, 0.08) 100%
      );
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s 0.5s;
    }

    .slide.active .slide-light-leak { opacity: 1; }

    /* ═══ SLIDE CAPTION ═══ */
    .slide-caption {
      text-align: center;
      padding: 0 1rem;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    .slide-caption-main {
      font-family: var(--f-ko-serif);
      font-size: clamp(1.25rem, 5vw, 1.75rem);
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 0.75rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
      transition-delay: 0.2s;
    }

    .slide.active .slide-caption-main {
      opacity: 1;
      transform: translateY(0);
    }

    .slide-caption-sub {
      font-family: var(--f-serif);
      font-size: 0.9375rem;
      font-style: italic;
      color: var(--cream-dim);
      line-height: 1.8;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
      transition-delay: 0.35s;
    }

    .slide.active .slide-caption-sub {
      opacity: 1;
      transform: translateY(0);
    }

    /* ═══ PROGRESS BAR ═══ */
    .progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--warm-dark);
      z-index: 100;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--red));
      transition: width 0.4s var(--ease-out);
    }

    /* ═══ PAGE INDICATORS ═══ */
    .page-indicators {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .page-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warm-dark);
      transition: all 0.4s var(--ease-out);
      cursor: pointer;
    }

    .page-dot.active {
      background: var(--gold);
      transform: scale(1.3);
    }

    .page-dot:hover:not(.active) {
      background: var(--cream-dim);
    }

    /* ═══ NAVIGATION ARROWS ═══ */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26, 23, 20, 0.8);
      border: 1px solid var(--warm-dark);
      border-radius: 50%;
      color: var(--cream);
      cursor: pointer;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s var(--ease-out), background 0.3s;
    }

    .nav-arrow:hover {
      background: var(--gold);
      color: var(--black);
      transform: translateY(-50%) scale(1.1);
    }

    .nav-arrow.visible { opacity: 1; }
    .nav-arrow.disabled { opacity: 0.3; pointer-events: none; }

    .nav-arrow--prev { left: 24px; }
    .nav-arrow--next { right: 24px; }

    .nav-arrow svg {
      width: 24px;
      height: 24px;
    }

    @media (max-width: 768px) {
      .nav-arrow { display: none; }
    }

    /* ═══ SWIPE HINT ═══ */
    .swipe-hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 60px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--f-mono);
      font-size: 0.65rem;
      color: var(--gold-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeInHint 1s 2s forwards, swipeHintPulse 2s 3s infinite;
      z-index: 90;
    }

    .swipe-hint.hidden { display: none; }

    @keyframes fadeInHint {
      to { opacity: 1; }
    }

    @keyframes swipeHintPulse {
      0%, 100% { opacity: 0.6; transform: translateX(-50%); }
      50% { opacity: 1; transform: translateX(-50%) translateX(5px); }
    }

    /* ═══ COVER SLIDE ═══ */
    .slide--cover {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .slide--cover .cover-content {
      max-width: 400px;
    }

    .cover-kodak {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.3s forwards;
    }

    .cover-kodak-k {
      font-family: var(--f-mono);
      font-size: 2.5rem;
      font-weight: 700;
      color: #FFD700;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
    }

    .cover-kodak-stripes {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cover-kodak-stripes span {
      height: 5px;
      background: var(--red);
      border-radius: 1px;
    }

    .cover-kodak-stripes span:nth-child(1) { width: 28px; }
    .cover-kodak-stripes span:nth-child(2) { width: 22px; }
    .cover-kodak-stripes span:nth-child(3) { width: 16px; }

    .cover-eyebrow {
      font-family: var(--f-mono);
      font-size: 0.65rem;
      color: var(--gold);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.5s forwards;
    }

    .cover-title {
      font-family: var(--f-ko-serif);
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 600;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.7s forwards;
    }

    .cover-subtitle {
      font-family: var(--f-serif);
      font-size: clamp(1rem, 4vw, 1.5rem);
      font-style: italic;
      color: var(--cream-dim);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.9s forwards;
    }

    .cover-meta {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-family: var(--f-mono);
      font-size: 0.7rem;
      color: var(--cream-dim);
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 1.1s forwards;
    }

    .cover-meta span {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cover-meta .gold { color: var(--gold); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ═══ END SLIDE ═══ */
    .slide--end {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .end-content {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out);
    }

    .slide--end.active .end-content {
      opacity: 1;
      transform: translateY(0);
    }

    .end-logo {
      font-family: var(--f-ko-serif);
      font-size: 2rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .end-text {
      font-family: var(--f-serif);
      font-size: 1.25rem;
      font-style: italic;
      color: var(--cream-dim);
      margin-bottom: 0.5rem;
    }

    .end-text-ko {
      font-family: var(--f-ko-serif);
      font-size: 1rem;
      color: var(--cream-dim);
      margin-bottom: 3rem;
    }

    .end-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .end-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2rem;
      font-family: var(--f-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--gold);
      color: var(--gold);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s var(--ease-out);
    }

    .end-btn:hover {
      background: var(--gold);
      color: var(--black);
    }

    .end-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ═══ LOADING ═══ */
    .loading {
      position: fixed;
      inset: 0;
      background: var(--black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s, visibility 0.5s;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--warm-dark);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 1.5rem;
      font-family: var(--f-mono);
      font-size: 0.7rem;
      color: var(--gold-dim);
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>

  <div class="grain"></div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <p class="loading-text">LOADING FILM...</p>
  </div>

  <!-- Header -->
  <header class="viewer-header" id="header">
    <a href="index.html" class="header-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="header-title" id="headerTitle"></h1>
    <span class="header-counter" id="headerCounter">1 / 1</span>
  </header>

  <!-- Film Sprockets -->
  <div class="film-sprocket-side film-sprocket-side--left">
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
  </div>
  <div class="film-sprocket-side film-sprocket-side--right">
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
    <span class="sprocket"></span>
  </div>

  <!-- Film Container -->
  <div class="film-container" id="filmContainer">
    <div class="slides-track" id="slidesTrack">
      <!-- Slides will be inserted by JS -->
    </div>
  </div>

  <!-- Navigation Arrows -->
  <button class="nav-arrow nav-arrow--prev" id="navPrev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>
  <button class="nav-arrow nav-arrow--next visible" id="navNext">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </button>

  <!-- Progress Bar -->
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Page Indicators -->
  <div class="page-indicators" id="pageIndicators"></div>

  <!-- Swipe Hint -->
  <div class="swipe-hint" id="swipeHint">
    <span>← Swipe →</span>
  </div>

  <script>
  (function() {
    'use strict';

    const storiesData = {

        frames: [
          { image: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800&q=80', caption: '알람은 필요 없다.', caption_ko: '몸이 먼저 일어난다.' },
          { image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800&q=80', caption: '첫 번째 반죽을 치댄다.', caption_ko: '아직 세상이 잠든 시간.' },
          { image: 'https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=800&q=80', caption: '오븐이 예열되는 소리.', caption_ko: '하루의 시작을 알린다.' },
          { image: 'https://images.unsplash.com/photo-1517686469429-8bdb88b9f907?w=800&q=80', caption: '첫 손님이 오기 전.', caption_ko: '이미 수십 개의 빵이 준비되어 있다.' },
          { image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=800&q=80', caption: '20년, 7300번의 새벽.', caption_ko: '이게 장인이다.' }
        ]
      },
      cream: {
        id: 'cream',
        category: 'bread',
        title: '크림치즈의 비밀',
        subtitle: '부드러움의 과학',
        date: '2010',
        frames: [
          { image: 'https://images.unsplash.com/photo-1486427944544-d2c6128c6029?w=800&q=80', caption: '크림치즈는 온도가 전부다.', caption_ko: '차가우면 뻑뻑하고, 뜨거우면 흘러내린다.' },
          { image: 'https://images.unsplash.com/photo-1517686469429-8bdb88b9f907?w=800&q=80', caption: '손끝으로 온도를 잰다.', caption_ko: '온도계가 말하지 못하는 것.' },
          { image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800&q=80', caption: '빵 속에 넣는 순간.', caption_ko: '10년의 노하우가 들어간다.' },
          { image: 'https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=800&q=80', caption: '한 입 베어 물면.', caption_ko: '부드러움이 터진다.' }
        ]
      },
      hands: {
        id: 'hands',
        category: 'chef',
        title: '손의 기억',
        subtitle: '기계가 모르는 감촉',
        date: '2015',
        frames: [
          { image: 'https://images.unsplash.com/photo-1517686469429-8bdb88b9f907?w=800&q=80', caption: '손은 기억한다.', caption_ko: '20년 동안 반복한 움직임.' },
          { image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800&q=80', caption: '반죽의 탄력.', caption_ko: '손바닥이 먼저 안다.' },
          { image: 'https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=800&q=80', caption: '온도의 변화.', caption_ko: '손끝이 감지한다.' },
          { image: 'https://images.unsplash.com/photo-1486427944544-d2c6128c6029?w=800&q=80', caption: '완성의 순간.', caption_ko: '손이 말해준다.' },
          { image: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800&q=80', caption: '기계는 흉내 낼 수 없다.', caption_ko: '이게 손맛이다.' },
          { image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=800&q=80', caption: '손에서 손으로.', caption_ko: '전해지는 따뜻함.' }
        ]
      }
    };

    // Get story ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const storyId = urlParams.get('id') || 'sobulgogi';
    const story = storiesData[storyId] || storiesData.sobulgogi;

    // DOM elements
    const loading = document.getElementById('loading');
    const slidesTrack = document.getElementById('slidesTrack');
    const header = document.getElementById('header');
    const headerTitle = document.getElementById('headerTitle');
    const headerCounter = document.getElementById('headerCounter');
    const progressFill = document.getElementById('progressFill');
    const pageIndicators = document.getElementById('pageIndicators');
    const navPrev = document.getElementById('navPrev');
    const navNext = document.getElementById('navNext');
    const swipeHint = document.getElementById('swipeHint');

    let currentSlide = 0;
    let totalSlides = 0;
    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    let translateX = 0;

    // Build slides
    function buildSlides() {
      // Cover slide
      const coverSlide = document.createElement('div');
      coverSlide.className = 'slide slide--cover active';
      coverSlide.innerHTML = `
        <div class="cover-content">
          <div class="cover-kodak">
            <span class="cover-kodak-k">K</span>
            <div class="cover-kodak-stripes">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <p class="cover-eyebrow">Photo Essay</p>
          <h1 class="cover-title">${story.title}</h1>
          <p class="cover-subtitle">${story.subtitle}</p>
          <div class="cover-meta">
            <span><span class="gold">${story.date}</span></span>
            <span><span class="gold">${story.frames.length}</span> frames</span>
          </div>
        </div>
      `;
      slidesTrack.appendChild(coverSlide);

      // Content slides
      story.frames.forEach((frame, index) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.innerHTML = `
          <div class="slide-image-container">
            <div class="slide-image-frame">
              <img class="slide-image" src="${frame.image}" alt="${frame.caption}" loading="${index < 2 ? 'eager' : 'lazy'}">
              <div class="slide-image-grain"></div>
              <div class="slide-light-leak"></div>
              <span class="slide-frame-num">▶ ${String(index + 1).padStart(3, '0')}</span>
              <span class="slide-kodak-edge">KODAK 5247 · 호야당</span>
            </div>
          </div>
          <div class="slide-caption">
            <p class="slide-caption-main">"${frame.caption}"</p>
            <p class="slide-caption-sub">${frame.caption_ko}</p>
          </div>
        `;
        slidesTrack.appendChild(slide);
      });

      // End slide
      const endSlide = document.createElement('div');
      endSlide.className = 'slide slide--end';
      endSlide.innerHTML = `
        <div class="end-content">
          <p class="end-logo">호야당</p>
          <p class="end-text">Con las manos.</p>
          <p class="end-text-ko">손으로.</p>
          <div class="end-actions">
            <a href="index.html" class="end-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 12h18M3 12l6-6M3 12l6 6"/>
              </svg>
              More Stories
            </a>
            <a href="/" class="end-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              </svg>
              Home
            </a>
          </div>
        </div>
      `;
      slidesTrack.appendChild(endSlide);

      totalSlides = story.frames.length + 2; // cover + frames + end
    }

    // Build page indicators
    function buildIndicators() {
      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement('button');
        dot.className = 'page-dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goToSlide(i));
        pageIndicators.appendChild(dot);
      }
    }

    // Go to slide
    function goToSlide(index) {
      if (index < 0 || index >= totalSlides) return;

      currentSlide = index;
      translateX = -index * 100;
      slidesTrack.style.transform = `translateX(${translateX}vw)`;

      // Update active states
      const slides = slidesTrack.querySelectorAll('.slide');
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });

      const dots = pageIndicators.querySelectorAll('.page-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });

      // Update header
      headerTitle.classList.toggle('visible', index > 0 && index < totalSlides - 1);
      headerTitle.textContent = story.title;
      headerCounter.textContent = index === 0 ? 'COVER' : index === totalSlides - 1 ? 'END' : `${index} / ${story.frames.length}`;

      // Update progress
      progressFill.style.width = `${(index / (totalSlides - 1)) * 100}%`;

      // Update nav arrows
      navPrev.classList.toggle('visible', index > 0);
      navPrev.classList.toggle('disabled', index === 0);
      navNext.classList.toggle('disabled', index === totalSlides - 1);

      // Hide swipe hint after first navigation
      if (index > 0) swipeHint.classList.add('hidden');
    }

    // Touch/Mouse handling
    function handleDragStart(e) {
      isDragging = true;
      startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      currentX = startX;
      slidesTrack.classList.add('dragging');
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const diff = currentX - startX;
      const movePercent = (diff / window.innerWidth) * 100;
      slidesTrack.style.transform = `translateX(${translateX + movePercent}vw)`;
    }

    function handleDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      slidesTrack.classList.remove('dragging');

      const diff = currentX - startX;
      const threshold = window.innerWidth * 0.15;

      if (diff > threshold && currentSlide > 0) {
        goToSlide(currentSlide - 1);
      } else if (diff < -threshold && currentSlide < totalSlides - 1) {
        goToSlide(currentSlide + 1);
      } else {
        goToSlide(currentSlide);
      }
    }

    // Keyboard navigation
    function handleKeydown(e) {
      if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1);
      if (e.key === 'ArrowRight') goToSlide(currentSlide + 1);
      if (e.key === 'Escape') window.location.href = 'index.html';
    }

    // Initialize
    function init() {
      buildSlides();
      buildIndicators();

      // Event listeners
      slidesTrack.addEventListener('mousedown', handleDragStart);
      slidesTrack.addEventListener('mousemove', handleDragMove);
      slidesTrack.addEventListener('mouseup', handleDragEnd);
      slidesTrack.addEventListener('mouseleave', handleDragEnd);

      slidesTrack.addEventListener('touchstart', handleDragStart, { passive: true });
      slidesTrack.addEventListener('touchmove', handleDragMove, { passive: true });
      slidesTrack.addEventListener('touchend', handleDragEnd);

      navPrev.addEventListener('click', () => goToSlide(currentSlide - 1));
      navNext.addEventListener('click', () => goToSlide(currentSlide + 1));

      document.addEventListener('keydown', handleKeydown);

      // Preload images
      story.frames.forEach(frame => {
        const img = new Image();
        img.src = frame.image;
      });

      // Hide loading
      setTimeout(() => {
        loading.classList.add('hidden');
      }, 800);
    }

    // Start
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>

</body>
