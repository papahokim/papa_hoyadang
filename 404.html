<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이동 중... | 好爺堂</title>
  <meta http-equiv="refresh" content="0;url=/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFAF5;
      font-family: -apple-system, sans-serif;
      color: #1A1A1A;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #F5E6D3;
      border-top-color: #D4A853;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>홈으로 이동 중...</p>
  </div>
  <script>
    location.replace('/');
  </script>
</body>
</html>
