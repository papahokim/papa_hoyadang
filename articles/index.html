<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>글 목록 | 好爺堂</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --gold: #D4AF37;
      --gold-dim: rgba(212,175,55,.15);
      --text: #F5F5F0;
      --muted: rgba(245,245,240,.45);
      --border: rgba(245,245,240,.1);
      --r: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .app { max-width: 540px; margin: 0 auto; }

    /* Header */
    .head { text-align: center; padding: 24px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .head-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .head-count { font-size: 13px; color: var(--muted); }
    .head-back { display: inline-block; margin-top: 12px; font-size: 13px; color: var(--gold); text-decoration: none; }

    /* Floor Tabs */
    .floor-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
    .floor-tab {
      flex: 1; padding: 12px 8px; background: var(--card);
      border: 2px solid var(--border); border-radius: 12px;
      color: var(--muted); font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center; transition: all .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .floor-tab.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .floor-tab .tab-floor { font-size: 16px; font-weight: 700; display: block; margin-bottom: 2px; }
    .floor-tab .tab-label { font-size: 10px; }
    .floor-tab .tab-count {
      display: inline-block; margin-top: 4px; font-size: 10px;
      background: var(--gold-dim); padding: 1px 6px; border-radius: 8px; color: var(--gold);
    }

    /* Article List */
    .list { display: flex; flex-direction: column; gap: 8px; }

    .item {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--r);
      text-decoration: none; color: var(--text);
      transition: all .2s; -webkit-tap-highlight-color: transparent;
    }
    .item:active { border-color: var(--gold); background: var(--gold-dim); }

    .item-icon {
      width: 40px; height: 40px; background: var(--gold-dim);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-title {
      font-size: 15px; font-weight: 600; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-date { font-size: 12px; color: var(--muted); }
    .item-arrow { font-size: 16px; color: var(--muted); }

    /* States */
    .loading, .empty { text-align: center; padding: 60px 16px; color: var(--muted); }
    .loading-dot { font-size: 24px; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Footer */
    .foot {
      text-align: center; margin-top: 40px; padding-top: 20px;
      border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);
    }
    .foot a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>

<div class="app">
  <div class="head">
    <div class="head-title">好爺堂 글 목록</div>
    <div class="head-count" id="countText">불러오는 중...</div>
    <a href="../" class="head-back">← 홈으로</a>
  </div>

  <div class="floor-tabs" id="floorTabs">
    <button class="floor-tab active" data-path="all">
      <span class="tab-floor">ALL</span>
      <span class="tab-label">전체</span>
      <span class="tab-count" id="countAll">-</span>
    </button>
    <button class="floor-tab" data-path="1f">
      <span class="tab-floor">1F</span>
      <span class="tab-label">매장</span>
      <span class="tab-count" id="count1f">-</span>
    </button>
    <button class="floor-tab" data-path="2f">
      <span class="tab-floor">2F</span>
      <span class="tab-label">스튜디오</span>
      <span class="tab-count" id="count2f">-</span>
    </button>
    <button class="floor-tab" data-path="3f">
      <span class="tab-floor">3F</span>
      <span class="tab-label">오피스</span>
      <span class="tab-count" id="count3f">-</span>
    </button>
  </div>

  <div id="content">
    <div class="loading">
      <div class="loading-dot">...</div>
      <p>글 목록 불러오는 중</p>
    </div>
  </div>

  <div class="foot">
    <a href="../">好爺堂</a> · <a href="https://papafly.kr/tools/publisher.html">글 올리기</a>
  </div>
</div>

<script>
(function() {
  'use strict';

  var OWNER = 'dtslib1979';
  var REPO = 'hoyadang.com';
  var BASE = 'articles';
  var FLOORS = ['1f', '2f', '3f'];
  var ICONS = { '1f': '🍞', '2f': '🎬', '3f': '💼' };

  var allArticles = [];
  var currentFilter = 'all';

  function parseDateFromName(name) {
    var m = name.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '.' + m[2] + '.' + m[3];
    return '';
  }

  function makeTitle(name) {
    var clean = name.replace(/\.html$/, '');
    var m = clean.match(/^\d{4}-\d{2}-\d{2}-?\d*\s*(.*)$/);
    if (m && m[1]) return m[1];
    return clean.replace(/-/g, ' ').replace(/^\w/, function(c) { return c.toUpperCase(); });
  }

  async function fetchFloor(floor) {
    try {
      var res = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + BASE + '/' + floor);
      if (!res.ok) return [];
      var files = await res.json();
      return files
        .filter(function(f) { return f.name.endsWith('.html'); })
        .map(function(f) { return { name: f.name, floor: floor, path: floor + '/' + f.name }; });
    } catch (e) { return []; }
  }

  async function fetchRoot() {
    try {
      var res = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + BASE);
      if (!res.ok) return [];
      var files = await res.json();
      return files
        .filter(function(f) { return f.name.endsWith('.html') && f.name !== 'index.html'; })
        .map(function(f) { return { name: f.name, floor: 'root', path: f.name }; });
    } catch (e) { return []; }
  }

  function render(filter) {
    var container = document.getElementById('content');
    var filtered = filter === 'all'
      ? allArticles
      : allArticles.filter(function(a) { return a.floor === filter; });

    filtered.sort(function(a, b) { return b.name.localeCompare(a.name); });

    if (filtered.length === 0) {
      container.innerHTML =
        '<div class="empty">' +
        '<div class="empty-icon">📝</div>' +
        '<p>아직 올린 글이 없습니다</p>' +
        '</div>';
      return;
    }

    var html = '<div class="list">';
    filtered.forEach(function(a) {
      var date = parseDateFromName(a.name);
      var title = makeTitle(a.name);
      var icon = ICONS[a.floor] || '📄';
      html += '<a href="' + a.path + '" class="item">' +
        '<div class="item-icon">' + icon + '</div>' +
        '<div class="item-info">' +
        '<div class="item-title">' + title + '</div>' +
        '<div class="item-date">' + (a.floor !== 'root' ? a.floor.toUpperCase() + ' · ' : '') + date + '</div>' +
        '</div>' +
        '<span class="item-arrow">›</span>' +
        '</a>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  async function loadAll() {
    var results = await Promise.all([
      fetchRoot(),
      fetchFloor('1f'),
      fetchFloor('2f'),
      fetchFloor('3f')
    ]);

    allArticles = results[0].concat(results[1]).concat(results[2]).concat(results[3]);

    var count1f = results[1].length;
    var count2f = results[2].length;
    var count3f = results[3].length;
    var total = allArticles.length;

    document.getElementById('countAll').textContent = total;
    document.getElementById('count1f').textContent = count1f;
    document.getElementById('count2f').textContent = count2f;
    document.getElementById('count3f').textContent = count3f;
    document.getElementById('countText').textContent = total + '개 글';

    render('all');
  }

  // Tab clicks
  document.querySelectorAll('.floor-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.floor-tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentFilter = tab.getAttribute('data-path');
      render(currentFilter);
    });
  });

  loadAll();
})();
</script>

</body>
</html>
