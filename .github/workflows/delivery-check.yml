name: Check Delivery Links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check delivery share URLs
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 공유 링크는 리다이렉터 — HTTP 응답(200/301/302)이 오면 alive
          # 404/000/5xx = dead
          check_share_url() {
            local key="$1"
            local url="$2"
            local status
            local alive="false"

            # -L 안 씀 — 리다이렉터 자체의 응답만 확인
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo "000")

            # 200, 301, 302, 307, 308 = 리다이렉터 정상
            case "$status" in
              200|301|302|307|308) alive="true" ;;
            esac

            echo "${key}|${alive}|${status}"
          }

          COUPANG=$(check_share_url "coupang" "https://web.coupangeats.com/share?storeId=550712")
          BAEMIN=$(check_share_url "baemin" "https://s.baemin.com/d2000gCVdxUak")
          YOGIYO=$(check_share_url "yogiyo" "https://ws.yogiyo.co.kr/jnsce1")

          PREV=$(cat menu/delivery-status.json 2>/dev/null || echo "{}")

          C_ALIVE=$(echo "$COUPANG" | cut -d'|' -f2)
          C_HTTP=$(echo "$COUPANG" | cut -d'|' -f3)
          B_ALIVE=$(echo "$BAEMIN" | cut -d'|' -f2)
          B_HTTP=$(echo "$BAEMIN" | cut -d'|' -f3)
          Y_ALIVE=$(echo "$YOGIYO" | cut -d'|' -f2)
          Y_HTTP=$(echo "$YOGIYO" | cut -d'|' -f3)

          C_LAST=$(echo "$PREV" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('platforms',{}).get('coupang',{}).get('lastAlive','null'))" 2>/dev/null || echo "null")
          B_LAST=$(echo "$PREV" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('platforms',{}).get('baemin',{}).get('lastAlive','null'))" 2>/dev/null || echo "null")
          Y_LAST=$(echo "$PREV" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('platforms',{}).get('yogiyo',{}).get('lastAlive','null'))" 2>/dev/null || echo "null")

          [ "$C_ALIVE" = "true" ] && C_LAST="\"$NOW\"" || C_LAST=$([ "$C_LAST" = "null" ] && echo "null" || echo "\"$C_LAST\"")
          [ "$B_ALIVE" = "true" ] && B_LAST="\"$NOW\"" || B_LAST=$([ "$B_LAST" = "null" ] && echo "null" || echo "\"$B_LAST\"")
          [ "$Y_ALIVE" = "true" ] && Y_LAST="\"$NOW\"" || Y_LAST=$([ "$Y_LAST" = "null" ] && echo "null" || echo "\"$Y_LAST\"")

          C_ALIVE_BOOL=$([ "$C_ALIVE" = "true" ] && echo "true" || echo "false")
          B_ALIVE_BOOL=$([ "$B_ALIVE" = "true" ] && echo "true" || echo "false")
          Y_ALIVE_BOOL=$([ "$Y_ALIVE" = "true" ] && echo "true" || echo "false")
          C_LAST_VAL=$([ "$C_LAST" = "null" ] && echo "null" || echo "\"$C_LAST\"")
          B_LAST_VAL=$([ "$B_LAST" = "null" ] && echo "null" || echo "\"$B_LAST\"")
          Y_LAST_VAL=$([ "$Y_LAST" = "null" ] && echo "null" || echo "\"$Y_LAST\"")
          printf '{"updated":"%s","platforms":{"coupang":{"name":"쿠팡이츠","url":"https://web.coupangeats.com/share?storeId=550712","alive":%s,"lastAlive":%s,"httpStatus":"%s"},"baemin":{"name":"배달의민족","url":"https://s.baemin.com/d2000gCVdxUak","alive":%s,"lastAlive":%s,"httpStatus":"%s"},"yogiyo":{"name":"요기요","url":"https://ws.yogiyo.co.kr/jnsce1","alive":%s,"lastAlive":%s,"httpStatus":"%s"}}}\n' "$NOW" "$C_ALIVE_BOOL" "$C_LAST_VAL" "$C_HTTP" "$B_ALIVE_BOOL" "$B_LAST_VAL" "$B_HTTP" "$Y_ALIVE_BOOL" "$Y_LAST_VAL" "$Y_HTTP" > menu/delivery-status.json

          echo "=== Results ==="
          echo "쿠팡이츠: alive=$C_ALIVE http=$C_HTTP"
          echo "배달의민족: alive=$B_ALIVE http=$B_HTTP"
          echo "요기요: alive=$Y_ALIVE http=$Y_HTTP"
          cat menu/delivery-status.json

      - name: Commit if changed
        run: |
          git diff --quiet menu/delivery-status.json && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu/delivery-status.json
          git commit -m "chore: delivery link health check $(date -u +%Y-%m-%d)"
          git push
