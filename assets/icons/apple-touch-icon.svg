<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <filter id="inkBleed">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.3"/>
    </filter>
  </defs>

  <!-- Background - warm parchment paper -->
  <rect width="180" height="180" fill="#F5EDE0" rx="36"/>

  <!-- 好爺堂 vertical calligraphy - simplified for icon size -->
  <g fill="#1A1A1A" filter="url(#inkBleed)">
    <!-- 好 (호) - top -->
    <path d="M55 25 Q58 35 58 50 Q58 58 54 62" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M45 42 Q58 44 70 42" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M58 45 Q62 52 66 62" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M58 45 Q54 52 48 62" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M78 25 Q95 27 108 25" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M92 25 Q92 45 92 55 Q92 60 86 65" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M78 42 Q92 44 106 42" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- 爺 (야) - middle, largest -->
    <path d="M55 75 Q90 72 125 75" stroke="#1A1A1A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M75 75 Q68 95 58 115" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M105 75 Q112 95 122 115" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M70 95 Q90 97 110 95" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- 堂 (당) - bottom -->
    <path d="M55 125 Q90 122 125 125" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M68 132 L68 148 L112 148 L112 132 Z" stroke="#1A1A1A" stroke-width="3" fill="none"/>
    <path d="M90 125 Q90 140 90 155" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M50 155 Q90 152 130 155" stroke="#1A1A1A" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Red seal (낙관) -->
  <g transform="translate(125, 130)">
    <rect x="0" y="0" width="42" height="42" fill="#C41E3A" rx="3" opacity="0.85"/>
    <text x="21" y="30" font-family="serif" font-size="16" fill="#F5EDE0" text-anchor="middle" font-weight="bold">好</text>
  </g>
</svg>
