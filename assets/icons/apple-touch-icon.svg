<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="appleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#B8956F"/>
    </linearGradient>
  </defs>

  <!-- Background - Dark Green -->
  <rect width="180" height="180" fill="#0D3320" rx="40"/>

  <!-- Abstract concentric circles -->
  <circle cx="90" cy="70" r="45" fill="none" stroke="url(#appleGold)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="90" cy="70" r="33" fill="none" stroke="url(#appleGold)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="90" cy="70" r="21" fill="none" stroke="url(#appleGold)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="90" cy="70" r="9" fill="none" stroke="url(#appleGold)" stroke-width="1.5" opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="90" cy="70" r="3" fill="#D4A853"/>

  <!-- 호야당 Text -->
  <text x="90" y="145"
        font-family="Noto Sans KR, sans-serif"
        font-size="26"
        font-weight="700"
        fill="#FFFFFF"
        text-anchor="middle">호야당</text>
</svg>
