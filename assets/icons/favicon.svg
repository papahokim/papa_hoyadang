<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="50%" stop-color="#D4892A"/>
      <stop offset="100%" stop-color="#B8741E"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A0"/>
      <stop offset="100%" stop-color="#F5D060"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#1B4332"/>

  <!-- Croquette body -->
  <ellipse cx="256" cy="200" rx="140" ry="95" fill="url(#crust)" filter="url(#shadow)" transform="rotate(-15 256 200)"/>

  <!-- Cream filling (cut section) -->
  <ellipse cx="220" cy="210" rx="55" ry="40" fill="url(#cream)" transform="rotate(-15 220 210)"/>
  <ellipse cx="220" cy="210" rx="45" ry="32" fill="#FFF5CC" transform="rotate(-15 220 210)"/>

  <!-- Crust texture dots -->
  <g fill="#C67B1A" opacity="0.6">
    <circle cx="280" cy="160" r="4"/>
    <circle cx="310" cy="180" r="3"/>
    <circle cx="295" cy="210" r="4"/>
    <circle cx="330" cy="195" r="3"/>
    <circle cx="260" cy="140" r="3"/>
    <circle cx="320" cy="160" r="4"/>
    <circle cx="340" cy="210" r="3"/>
    <circle cx="270" cy="230" r="4"/>
    <circle cx="300" cy="240" r="3"/>
    <circle cx="350" cy="175" r="3"/>
  </g>

  <!-- 호야당 text -->
  <text x="256" y="400" font-family="'Noto Sans KR', sans-serif" font-size="80" font-weight="700" fill="#F5F1E6" text-anchor="middle">호야당</text>
</svg>
