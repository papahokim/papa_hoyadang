<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Brush stroke texture -->
    <filter id="brushTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Ink bleeding effect -->
    <filter id="inkBleed" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background - warm paper/parchment -->
  <rect width="512" height="512" fill="#F5EDE0"/>

  <!-- Subtle paper texture -->
  <rect width="512" height="512" fill="url(#paperGrain)" opacity="0.1"/>

  <!-- 好 (호) - top character -->
  <g filter="url(#inkBleed)" fill="#1A1A1A">
    <!-- 女 left part -->
    <path d="M95 85 Q100 90 105 130 Q108 150 100 170 L95 175 Q92 160 90 140 Q88 110 95 85" stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M80 140 Q120 145 155 140" stroke="#1A1A1A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M105 145 Q115 165 125 200" stroke="#1A1A1A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M105 145 Q95 165 80 195" stroke="#1A1A1A" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- 子 right part -->
    <path d="M160 85 Q200 90 230 85" stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M195 85 Q195 130 195 160 Q195 180 180 200" stroke="#1A1A1A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M165 135 Q195 140 225 135" stroke="#1A1A1A" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 爺 (야) - middle character, largest -->
  <g filter="url(#inkBleed)" fill="#1A1A1A">
    <!-- 父 top -->
    <path d="M140 230 Q200 220 260 230" stroke="#1A1A1A" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M180 230 Q165 270 145 310" stroke="#1A1A1A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M220 230 Q235 270 255 310" stroke="#1A1A1A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M170 270 Q200 275 230 270" stroke="#1A1A1A" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- 耳 left bottom -->
    <path d="M120 320 L120 400" stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M105 335 Q120 338 145 335" stroke="#1A1A1A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M105 360 Q120 363 145 360" stroke="#1A1A1A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M105 385 Q120 388 150 385" stroke="#1A1A1A" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- 阝 right bottom -->
    <path d="M280 320 Q275 350 280 380 Q285 400 275 420" stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M280 330 Q260 335 245 340" stroke="#1A1A1A" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 堂 (당) - bottom character -->
  <g filter="url(#inkBleed)" fill="#1A1A1A">
    <!-- 尚 top part -->
    <path d="M320 80 Q360 75 400 80" stroke="#1A1A1A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M330 100 Q330 130 330 155" stroke="#1A1A1A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M390 100 Q390 130 390 155" stroke="#1A1A1A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M330 155 Q360 160 390 155" stroke="#1A1A1A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M340 120 Q360 125 380 120" stroke="#1A1A1A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- 口 middle -->
    <path d="M335 170 L335 210 L385 210 L385 170 Z" stroke="#1A1A1A" stroke-width="7" fill="none" stroke-linejoin="round"/>

    <!-- 土 bottom -->
    <path d="M310 260 Q360 255 410 260" stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M360 220 Q360 270 360 310" stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M300 310 Q360 305 420 310" stroke="#1A1A1A" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Red seal stamp (낙관) -->
  <g transform="translate(380, 380)">
    <rect x="0" y="0" width="100" height="100" fill="#C41E3A" rx="5" opacity="0.9"/>
    <text x="50" y="60" font-family="serif" font-size="36" fill="#F5EDE0" text-anchor="middle" font-weight="bold">好</text>
    <text x="50" y="95" font-family="serif" font-size="28" fill="#F5EDE0" text-anchor="middle">爺堂</text>
  </g>
</svg>
