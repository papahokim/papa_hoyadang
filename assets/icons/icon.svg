<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#B8956F"/>
    </linearGradient>
  </defs>

  <!-- Background - Dark Green -->
  <rect width="512" height="512" fill="#0D3320"/>

  <!-- Abstract concentric circles -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#warmGold)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="220" r="105" fill="none" stroke="url(#warmGold)" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="220" r="70" fill="none" stroke="url(#warmGold)" stroke-width="2" opacity="0.7"/>
  <circle cx="256" cy="220" r="35" fill="none" stroke="url(#warmGold)" stroke-width="2" opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="256" cy="220" r="8" fill="#D4A853"/>

  <!-- 호야당 Text -->
  <text x="256" y="420"
        font-family="Noto Sans KR, sans-serif"
        font-size="72"
        font-weight="700"
        fill="#FFFFFF"
        text-anchor="middle">호야당</text>
</svg>
